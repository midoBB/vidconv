[package]
name = "vidconv"
version = "2.1.1"
edition = "2024"
description = "Batch-convert videos to 720p H.264/AAC MP4 with VAAPI or libx264"
license = "MIT"
repository = "https://github.com/midoBB/vidconv"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
console = "0.16.6"
libc = "0.2.190"
ratatui = "0.30.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.5"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
